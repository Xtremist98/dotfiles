# =========================
# DOWNLOAD LOCATION
# =========================
dir=/mnt/media

# =========================
# DOWNLOAD BEHAVIOR
# =========================
continue=true
always-resume=true
auto-file-renaming=false

# =========================
# CONNECTION TUNING
# =========================
max-concurrent-downloads=4
max-connection-per-server=8
split=8
min-split-size=10M

# =========================
# MEMORY / DISK
# =========================
file-allocation=none
disk-cache=32M

# =========================
# NETWORK RELIABILITY
# =========================
timeout=30
connect-timeout=10
max-tries=0
retry-wait=3
lowest-speed-limit=0

# =========================
# RPC (FOR ARIANG)
# =========================
enable-rpc=true
rpc-listen-port=6800
rpc-allow-origin-all=true

# Keep local only
rpc-listen-all=false

# Optional:
# rpc-secret=change_this_to_a_random_string

# =========================
# TORRENT SUPPORT
# =========================
enable-dht=true
enable-peer-exchange=true
bt-max-peers=60
bt-request-peer-speed-limit=1M

# =========================
# SESSION
# =========================
save-session=/home/linuxer/.config/aria2/aria2.session
input-file=/home/linuxer/.config/aria2/aria2.session
save-session-interval=60
