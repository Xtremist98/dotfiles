# omarchy-pine — Rose Pine x Catppuccin Mocha blend (2026-09-02)
# Background is FLAT #191724 everywhere (rose-pine base). Every other color
# is drawn from BOTH palettes: the 8 core semantic slots mix catppuccin's
# vivid red/green/blue/orange with rose-pine's gold/foam/iris; the bright
# tier pulls catppuccin's cooler/lighter tones; the supplementary block
# exposes the remaining unique colors of both palettes for themed apps.
mode = "dark"

# ── UI accents ────────────────────────────────────────────────────────────
accent = "#ebbcba"          # rose-pine rose (headline UI accent)
cursor = "#e0def4"
selection = "#524f67"       # rose-pine highlight_high (visible on #191724)
selection_background = "#524f67"
selection_foreground = "#191724"

# ── Surfaces (FLAT #191724 — only dark value allowed) ────────────────────
background = "#191724"
dark_background = "#191724"
darker_background = "#191724"
lighter_background = "#191724"

# ── Text ──────────────────────────────────────────────────────────────────
foreground = "#e0def4"      # rose-pine text
dark_foreground = "#6e6a86" # rose-pine muted
light_foreground = "#908caa" # rose-pine subtle
bright_foreground = "#e0def4"
muted = "#6e6a86"           # rose-pine muted

# ── Core semantic colors (blend) ──────────────────────────────────────────
red = "#f38ba8"             # catppuccin red
green = "#a6e3a1"           # catppuccin green
yellow = "#f6c177"          # rose-pine gold
blue = "#89b4fa"            # catppuccin blue
magenta = "#c4a7e7"         # rose-pine iris
cyan = "#9ccfd8"            # rose-pine foam
orange = "#fab387"          # catppuccin peach
brown = "#eba0ac"           # catppuccin maroon

# ── Bright tier (catppuccin cooler/lighter tones) ─────────────────────────
bright_red = "#eb6f92"      # rose-pine love
bright_green = "#94e2d5"    # catppuccin teal
bright_yellow = "#f9e2af"   # catppuccin yellow
bright_blue = "#74c7ec"     # catppuccin sapphire
bright_magenta = "#f5c2e7"  # catppuccin pink
bright_cyan = "#89dceb"     # catppuccin sky

# ── Supplementary block (remaining unique palette colors, no darks) ───────
# Rose Pine
love = "#eb6f92"
rose = "#ebbcba"
gold = "#f6c177"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
subtle = "#908caa"
# Catppuccin Mocha (colorful only — surface/mantle/crust darks excluded,
# background stays #191724)
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
maroon = "#eba0ac"
peach = "#fab387"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
