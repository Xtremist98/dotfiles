context.modules = [
    { name = libpipewire-module-parametric-equalizer
      args = {
          equalizer.filepath = "/home/linuxer/.config/pipewire/eq.txt"
          equalizer.description = "Parametric EQ"
          audio.channels = 2
          audio.position = [FL, FR]
          capture.props = {
              node.name = "eq_input"
              media.class = "Audio/Sink"
          }
          playback.props = {
              node.name = "eq_output"
              node.passive = true
              # Replace 'ALSA_SINK_NAME' with your actual hardware sink name from: pactl list short sinks
              node.target = "alsa_output.pci-0000_00_1b.0.analog-stereo"
          }
      }
    }
]

