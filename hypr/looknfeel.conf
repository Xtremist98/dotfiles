# Refer to https://wiki.hypr.land/Configuring/Basics/Variables/

general {
    col.active_border = rgba(101315ee) rgba(101315ee) rgba(101315ee) rgba(798186ee) rgba(798186ee) rgba(798186ee) rgba(798186ee) rgba(798186ee) 30deg 
    col.inactive_border = rgb(1e1e1e) 90deg
    gaps_in = 4
    gaps_out = 5
    border_size = 2
}


# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {
     rounding = 6
    rounding_power = 3
      shadow {
      enabled = yes
      range = 16
      color = rgba(00000052)
}

    # https://wiki.hypr.land/Configuring/Basics/Variables/#blur
    blur {
        enabled = true
        size = 2
        passes = 2
        special = true
        brightness = 0.60
        contrast = 0.75
    }
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#group
group {
    col.border_active = rgba(798186ee) rgba(101315ee) rgba(101315ee) rgba(798186ee) 5deg
    col.border_inactive = rgb(101315)

    groupbar {
        col.active = rgba(79818688)
        col.inactive = rgba(101315aa)
        text_color = rgb(101315)
        text_color_inactive = rgba(798186aa)
    }
}


# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {
    enabled = yes

    # Default animations, see https://wiki.hypr.land/Configuring/Advanced-and-Cool/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 8, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 3.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 0, 0, ease
    animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
}

# See https://wiki.hypr.land/Configuring/Layouts/Dwindle-Layout/ for more
dwindle {
    preserve_split = true
    force_split = 2
}

scrolling {
    column_width = 0.49
}

# See https://wiki.hypr.land/Configuring/Layouts/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    disable_scale_notification = true
    focus_on_activate = true
    anr_missed_pings = 3
    on_focus_under_fullscreen = 1
}

# https://wiki.hypr.land/Configuring/Basics/Variables/#cursor
cursor {
    hide_on_key_press = true
    warp_on_change_workspace = 1
}

# Auto toggle scratchpad on switching workspace from scratchpad
binds {
    hide_special_on_workspace_change = true
}

 # WindowRules
   windowrule = opacity 1 1, match:class ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
   windowrule = match:class ^(vesktop|Vesktop)$, opacity 1.0 override, no_dim on
   windowrule = match:class ^(code|VSCode|VSCodium)$, opacity 1.0 override, no_dim on
   windowrule = match:class ^(chromium|Chromium|google-chrome|Brave|brave-browser)$, opacity 1.0 override, no_dim on
   
# Make Mpv to float in certain Size
  # windowrule = float on, match:class mpv
  # windowrule = center on, match:class mpv
  # windowrule = size 1000 650, match:class mpv

    
# Make the Proton VPN app float and set a specific size and opacity
   windowrule = float on, match:class protonvpn-app
   windowrule = size 400 650, match:class protonvpn-app
   windowrule = center on, match:class protonvpn-app
   
# Make Gazelle float and center with specific size
   windowrule = float on, match:class org.omarchy.gazelle
   windowrule = size 875 600, match:class org.omarchy.gazelle
   windowrule = center on, match:class org.omarchy.gazelle
   
# Make windscribe VPN float
   windowrule = float on, match:class Windscribe
  # windowrule = size 200 300, match:class Windscribe
   windowrule = center on, match:class Windscribe
   
# Make Superfile TUI floating
   windowrule = float on, match:class org.omarchy.spf
   windowrule = size 875 600, match:class org.omarchy.spf
   windowrule = center on, match:class org.omarchy.spf
   
# Make rmpc float
   windowrule = float on, match:class org.omarchy.rmpc
   windowrule = size 875 600, match:class org.omarchy.rmpc
   windowrule = center on, match:class org.omarchy.rmpc  
   
# Make Kew float
   windowrule = float on, match:class org.omarchy.kew
   windowrule = size 875 600, match:class org.omarchy.kew
   windowrule = center on, match:class org.omarchy.kew
   
# Make Qbittorrent float 
   # windowrule = float on, match:class org.qbittorrent.qBittorrent
   # windowrule = size 875 600, match:class org.qbittorrent.qBittorrent
   # windowrule = center on, match:class org.qbittorrent.qBittorrent 
   
# About size  
   windowrule = float on, match:class org.omarchy.bash
   windowrule = size 1200 1075, match:class org.omarchy.bash
   windowrule = center on, match:class org.omarchy.bash
   
# Youtube-tui
   windowrule = float on, match:class org.omarchy.youtube-tui
   windowrule = size 875 600, match:class org.omarchy.youtube-tui
   windowrule = center on, match:class org.omarchy.youtube-tui
   
# General Opacity of Hyprland       
 # windowrule = opacity 0.97 0.9, match:class .*
    
# All floating windows opacity
  # windowrule = opacity 0.8 0.8, match:tag floating-window
   
gestures {
  gesture = 3, horizontal, workspace
  gesture = 3, up, close
  gesture = 4, horizontal, move
  gesture = 4, up, fullscreen
  gesture = 4, down, float
}

