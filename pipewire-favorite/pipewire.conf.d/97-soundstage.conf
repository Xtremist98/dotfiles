context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "SoundStage"
      media.name       = "SoundStage"
      filter.graph = {
        nodes = [
          # --- SIDE SIGNAL ---
          { type = builtin label = mixer name = sideL control = { "Gain 1" = 1.0 "Gain 2" = -0.95 } }
          { type = builtin label = mixer name = sideR control = { "Gain 1" = -0.95 "Gain 2" = 1.0 } }

          # --- WIDTH BOOST ---
          { type = builtin label = mixer name = widenL control = { "Gain 1" = 0.63 } }
          { type = builtin label = mixer name = widenR control = { "Gain 1" = 0.63 } }

          # --- OUTPUT MIXERS ---
          { type = builtin label = mixer name = outL control = { "Gain 1" = 1.0 } }
          { type = builtin label = mixer name = outR control = { "Gain 1" = 1.0 } }
        ]

        links = [
          { output = "sideL:Out" input = "widenL:In 1" }
          { output = "sideR:Out" input = "widenR:In 1" }

          { output = "widenL:Out" input = "outL:In 1" }
          { output = "widenR:Out" input = "outR:In 1" }
        ]

        inputs  = [ "sideL:In 1" "sideR:In 1" ]
        outputs = [ "outL:Out" "outR:Out" ]
      }

      capture.props = {
        node.name   = "soundstage_input"
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }

      playback.props = {
        node.name    = "soundstage_output"
        node.passive = true
        node.target  = "alsa_output.pci-0000_00_1b.0.analog-stereo"
      }
    }
  }
]
