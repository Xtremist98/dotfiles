context.modules = [
    { name = libpipewire-module-filter-chain
      args = {
          node.description = "SoundStage"
          media.name       = "SoundStage"
          filter.graph = {
              nodes = [
                  # Step 1: Create the "Side" signal (L - R)
                  { type = builtin label = mixer name = sideL control = { "Gain 1" = 1.0 "Gain 2" = -1.0 } }
                  { type = builtin label = mixer name = sideR control = { "Gain 1" = -1.0 "Gain 2" = 1.0 } }
                  
                  # Step 2: Boost the "Side" signal (Wideness Factor)
                  # 0.6 is a strong widening effect. Increase for more width.
                  { type = builtin label = mixer name = widenL control = { "Gain 1" = 0.65 } }
                  { type = builtin label = mixer name = widenR control = { "Gain 1" = 0.65 } }
                  
                  # Step 3: Mix the widened side back into the original signal
                  { type = builtin label = mixer name = outL }
                  { type = builtin label = mixer name = outR }
                  { type = builtin label = mixer name = crossL control = { "Gain 1" = 1.0 "Gain 2" = 0.08 } }
                  { type = builtin label = mixer name = crossR control = { "Gain 1" = 0.08 "Gain 2" = 1.0 } }
              ]
              links = [
                  # Connect Inputs to Side Calculation
                  { output = "sideL:Out" input = "widenL:In 1" }
                  { output = "sideR:Out" input = "widenR:In 1" }
                  
                  # Final Mix (Original + Widened Side)
                  { output = "widenL:Out" input = "outL:In 2" }
                  { output = "widenR:Out" input = "outR:In 2" }
                  
                  # ---- CROSSFEED ----
                  { output = "outL:Out" input = "crossL:In 1" }
                  { output = "outR:Out" input = "crossL:In 2" }

                  { output = "outL:Out" input = "crossR:In 1" }
                  { output = "outR:Out" input = "crossR:In 2" }
              ]
              inputs  = [ "sideL:In 1" "sideR:In 1" "outL:In 1" "outR:In 1" ]
              outputs = [ "crossL:Out" "crossR:Out" ]
          }
          capture.props = {
              node.name   = "soundstage_input"
              media.class = Audio/Sink
              audio.channels = 2
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name    = "soundstage_output"
              node.passive = true
              node.target  = "alsa_output.pci-0000_00_1b.0.analog-stereo"
          }
      }
    }
]

