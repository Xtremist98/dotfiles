context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Surround"
      media.name       = "Surround"
      filter.graph = {
        nodes = [
          { type = builtin label = copy name = copyFL }
          { type = builtin label = copy name = copyFR }

          # STEP 1: SIDE EXTRACTION
          { type = builtin label = mixer name = sideL control = { "Gain 1" = 1.0 "Gain 2" = -1.0 } }
          { type = builtin label = mixer name = sideR control = { "Gain 1" = -1.0 "Gain 2" = 1.0 } }

          # STEP 2: DEPTH DELAY
          { type = builtin label = delay name = delayL config = { "max-delay" = 0.5 "delay" = 0.032 } }
          { type = builtin label = delay name = delayR config = { "max-delay" = 0.5 "delay" = 0.035 } }

          # STEP 3: CROSSFEED
          { type = builtin label = mixer name = crossL control = { "Gain 1" = 0.68 "Gain 2" = 0.25 } }
          { type = builtin label = mixer name = crossR control = { "Gain 1" = 0.32 "Gain 2" = 0.75 } }

          # STEP 4: AIR REFLECTION (High-Passed)
          { type = builtin label = bq_highpass name = airHPL config = { freq = 2500 } }
          { type = builtin label = bq_highpass name = airHPR config = { freq = 2500 } }
          { type = builtin label = delay name = airL config = { "max-delay" = 0.02 "delay" = 0.006 } }
          { type = builtin label = delay name = airR config = { "max-delay" = 0.02 "delay" = 0.007 } }
          { type = builtin label = mixer name = airMixL control = { "Gain 1" = 1.0 "Gain 2" = 0.15 } } # Lowered from 0.8 for clarity
          { type = builtin label = mixer name = airMixR control = { "Gain 1" = 1.0 "Gain 2" = 0.15 } }

          # STEP 5: FINAL MIX
          { type = builtin label = mixer name = outL control = { "Gain 1" = 1.0 "Gain 2" = 0.65 } }
          { type = builtin label = mixer name = outR control = { "Gain 1" = 1.0 "Gain 2" = 0.65 } }
        ]

        links = [
          # Side extraction
          { output = "copyFL:Out" input = "sideL:In 1" } { output = "copyFR:Out" input = "sideL:In 2" }
          { output = "copyFL:Out" input = "sideR:In 1" } { output = "copyFR:Out" input = "sideR:In 2" }

          # Depth delay
          { output = "sideL:Out" input = "delayL:In" } { output = "sideR:Out" input = "delayR:In" }

          # Crossfeed
          { output = "copyFL:Out" input = "crossL:In 1" } { output = "copyFR:Out" input = "crossL:In 2" }
          { output = "copyFL:Out" input = "crossR:In 1" } { output = "copyFR:Out" input = "crossR:In 2" }

          # Air reflections (Fixed Routing: Delay -> HP -> AirDelay -> Mix)
          { output = "delayL:Out" input = "airHPL:In" }
          { output = "airHPL:Out" input = "airL:In" }
          { output = "delayL:Out" input = "airMixL:In 1" }
          { output = "airL:Out"   input = "airMixL:In 2" }

          { output = "delayR:Out" input = "airHPR:In" }
          { output = "airHPR:Out" input = "airR:In" }
          { output = "delayR:Out" input = "airMixR:In 1" }
          { output = "airR:Out"   input = "airMixR:In 2" }

          # Final mix
          { output = "crossL:Out" input = "outL:In 1" } { output = "airMixL:Out" input = "outL:In 2" }
          { output = "crossR:Out" input = "outR:In 1" } { output = "airMixR:Out" input = "outR:In 2" }
        ]
        inputs  = [ "copyFL:In" "copyFR:In" ]
        outputs = [ "outL:Out" "outR:Out" ]
      }
      capture.props = {
        node.name   = "soundstage_input"
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name    = "soundstage_output"
        node.passive = true
        node.target  = "alsa_output.pci-0000_00_1b.0.analog-stereo"
      }
    }
  }
]

