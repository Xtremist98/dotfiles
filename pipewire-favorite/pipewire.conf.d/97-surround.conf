context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Surround"
      media.name       = "Surround"
      filter.graph = {
        nodes = [
          { type = builtin label = copy name = copyFL }
          { type = builtin label = copy name = copyFR }

          # STEP 1: SIDE EXTRACTION
          { type = builtin label = mixer name = sideL control = { "Gain 1" = 1.0 "Gain 2" = -1.0 } }
          { type = builtin label = mixer name = sideR control = { "Gain 1" = -1.0 "Gain 2" = 1.0 } }

          # STEP 2: DEPTH DELAY (Kept at 45ms for the big room sensation)
          { type = builtin label = delay name = delayL config = { "max-delay" = 0.5 "delay" = 0.045 } }
          { type = builtin label = delay name = delayR config = { "max-delay" = 0.5 "delay" = 0.048 } }

          # STEP 3: STRONGER CROSSFEED (Narrowing the stage to push it forward)
          # Gain 2 at 0.32 makes the image feel more like front speakers
          { type = builtin label = mixer name = crossL control = { "Gain 1" = 0.68 "Gain 2" = 0.32 } }
          { type = builtin label = mixer name = crossR control = { "Gain 1" = 0.32 "Gain 2" = 0.68 } }

          # STEP 4: FINAL MIX (Lowered Gain 2 to fix the "too wide" feeling)
          # Gain 1 (Center/Mid) = 1.0
          # Gain 2 (Side/Spatial) = 0.55  <-- Lowered from 0.85 to narrow the stage
          { type = builtin label = mixer name = outL control = { "Gain 1" = 1.0 "Gain 2" = 0.55 } }
          { type = builtin label = mixer name = outR control = { "Gain 1" = 1.0 "Gain 2" = 0.55 } }
        ]

        links = [
          { output = "copyFL:Out" input = "sideL:In 1" } { output = "copyFR:Out" input = "sideL:In 2" }
          { output = "copyFL:Out" input = "sideR:In 1" } { output = "copyFR:Out" input = "sideR:In 2" }
          { output = "sideL:Out" input = "delayL:In" } { output = "sideR:Out" input = "delayR:In" }
          { output = "copyFL:Out" input = "crossL:In 1" } { output = "copyFR:Out" input = "crossL:In 2" }
          { output = "copyFR:Out" input = "crossR:In 2" } { output = "copyFL:Out" input = "crossR:In 1" }
          { output = "crossL:Out" input = "outL:In 1" } { output = "delayL:Out" input = "outL:In 2" }
          { output = "crossR:Out" input = "outR:In 1" } { output = "delayR:Out" input = "outR:In 2" }
        ]
        inputs  = [ "copyFL:In" "copyFR:In" ]
        outputs = [ "outL:Out" "outR:Out" ]
      }
      capture.props = {
        node.name   = "soundstage_input"
        media.class = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name    = "soundstage_output"
        node.passive = true
        node.target  = "alsa_output.pci-0000_00_1b.0.analog-stereo"
      }
    }
  }
]

