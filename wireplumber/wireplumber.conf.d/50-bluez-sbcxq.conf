## Force SBC-XQ as the ONLY A2DP codec on this machine.
##
## WHY THIS LOCK EXISTS
## The soundcore R60i NC supports SBC/AAC/LDAC. If bluez5.codecs is left
## open, WirePlumber negotiates among them and defaults to the "best" one,
## i.e. AAC. On every reconnect it went back to AAC and the user had to
## switch to SBC-XQ in pavucontrol by hand. Pinning the pool to [ sbc_xq ]
## makes the buds ALWAYS come up in SBC-XQ with no manual step.
##
## NOTE ON LDAC (corrected 2026-09-25)
## An earlier version of this comment claimed "LDAC is Android-only". That
## is WRONG. Arch pipewire ships a working LDAC encoder
## (/usr/lib/spa-0.2/bluez5/libspa-codec-bluez5-ldac.so) and the buds
## accept it on firmware 04.89. LDAC is therefore genuinely available here
## -- it is simply a deliberate choice NOT to use it, for these reasons:
##   * SBC-XQ EDR3 carries up to ~600 kbps at 48 kHz, which measures at or
##     slightly above aptX HD (576 kbps). The headroom LDAC adds over that
##     is modest in practice.
##   * LDAC's headline 990 kbps mode is the least reliable: dropouts are
##     common at short distances. Its practical sweet spot is 660 kbps.
##   * SBC-XQ is proven on this hardware, costs less radio energy, and needs
##     no latency/quantum changes to the 18-stage HeSuVi chain.
## The real ceiling here is the custom flat EQ applied in the Soundcore app
## plus the pipewire parametric EQ, not the transport codec.
##
## MEASURED 2026-09-25 (btmon capture, /tmp/opencode/btmon/a2dp.txt)
## The earbuds announce SBC with Maximum Bitpool 39 -- unusually LOW (standard
## SBC HQ needs 51-53). All four channel modes and both subband counts are
## offered. PipeWire correctly settles on the XQ path: 48 kHz, DUAL CHANNEL,
## 8 subbands, 16 blocks, Loudness, bitpool 39 ~= 546 kbps. So the real
## ceiling is ~546 kbps, NOT 600 and NOT 630: SBC-XQ EDR3 (~600) would need
## bitpool 47, which these buds refuse. The bitpool-39 cap is by design --
## it is matched to the dual-channel XQ profile, where it yields ~546 kbps.
## (Fallback joint stereo at the same bitpool would be only ~273 kbps.)
## At 546 kbps this is still aptX HD (576 kbps) class, so LDAC remains
## not worth enabling.

monitor.bluez.properties = {
    bluez5.codecs = [ sbc_xq ]
    bluez5.enable-sbc-xq = true
}

## Stop WirePlumber from auto-switching the buds into the HFP/headset profile
## whenever any app opens a microphone input. Profile flapping is a common
## cause of interrupted/choppy audio on these buds (they also idle-glitch
## when a notification starts playing while a mic stream is open).
wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}