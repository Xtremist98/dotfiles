## Force SBC-XQ as the ONLY A2DP codec on this machine.
##
## The soundcore R60i NC supports SBC/AAC/LDAC. LDAC is Android-only, so on
## this PC WirePlumber negotiates among AAC and SBC(-XQ) and defaults to the
## "best" one, i.e. AAC. On every reconnect it goes back to AAC and the user
## must switch to SBC-XQ in pavucontrol manually.
##
## Restricting bluez5.codecs to [ sbc_xq ] makes SBC-XQ the only codec the
## BlueZ SPA plugin may negotiate, so the buds ALWAYS come up in SBC-XQ.
## SBC-XQ is also a high-bit SBC variant that these budget buds carry much
## more reliably than AAC, which reduces dropouts and stutter.

monitor.bluez.properties = {
    bluez5.codecs = [ sbc_xq ]
    bluez5.enable-sbc-xq = true
}

## Stop WirePlumber from auto-switching the buds into the HFP/headset profile
## whenever any app opens a microphone input. Profile flapping is a common
## cause of interrupted/choppy audio on these buds (they also idle-glitch
## when a notification starts playing while a mic stream is open).
wireplumber.settings = {
    bluetooth.autoswitch-to-headset-profile = false
}