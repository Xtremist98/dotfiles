## Auto-connect A2DP playback/capture profiles on Bluetooth devices.
## This helps speakers and receivers expose their audio profiles without
## requiring manual PipeWire/WirePlumber recovery.

monitor.bluez.rules = [
  # 1. Your original hardware auto-connect block
  {
    matches = [
      {
        device.name = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.auto-connect = [ a2dp_sink a2dp_source ]
        bluez5.enable-hw-volume = false
      }
    }
  },

  # 2. Fix to handle high-bitrate SBC-XQ streaming safely at 48000 Hz
  {
    matches = [
      {
        node.name = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        node.latency = 2048/48000
        audio.format = "S32LE"
        audio.rate = 48000
        bluez5.media-source-role = "audio"
      }
    }
  }
]

