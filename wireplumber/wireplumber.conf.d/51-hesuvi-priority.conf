## NOTE: THIS FILE IS A NO-OP BY DESIGN.
##
## The virtual-surround sink (effect_input.virtual-surround-7.1-hesuvi) is
## created by PIPEWIRE (pipewire.conf.d/02-hesuvi-surround.conf), not by the
## wireplumber monitor. Rule sections like `monitor.components` only apply to
## nodes the wireplumber SPA monitor creates (bluez/alsa/v4l2), so they never
## match this node. Priorities for this node MUST be set inside its own
## pipewire.conf.d module block (priority.driver/priority.session there), which
## is where they now live (hesuvi = 1500, eq_input = 200).
##
## The default sink is pinned to the virtual-surround node via the wireplumber
## state file (~/.local/state/wireplumber/default-nodes) + `wpctl set-default`.