# Keep the parametric EQ in the chain after HeSuVi.
#
# Without this, the EQ's playback node ("eq_output") has no explicit target, so
# WirePlumber resolves it to the default sink = the HeSuVi input. That creates a
# feedback loop (eq_output -> effect_input) and makes the intended
# effect_output -> eq_input link look like a "cycle" to the link-group check, so
# the EQ gets bypassed entirely and HeSuVi output goes straight to the device.
#
# The hook picks the best physical device for eq_output instead (bluez when the
# buds are connected, alsa otherwise), which both removes the loop and lets the
# HeSuVi -> EQ link succeed.
#
# Script: ~/.local/share/wireplumber/scripts/linking/find-device-target-for-eq.lua

wireplumber.components = [
  {
    name = linking/find-device-target-for-eq.lua
    type = script/lua
    provides = hooks.linking.target.find-device-for-eq
  }
]

wireplumber.profiles = {
  main = {
    hooks.linking.target.find-device-for-eq = required
  }
}
