# /etc/tlp.conf - Aggressive AC performance + battery saver
# HP EliteBook 840 G1 / i7-4600U / intel_cpufreq passive
# Deploy: sudo cp /tmp/tlp-performance-battery.conf /etc/tlp.conf && sudo tlp start

# ── Auto-switch profiles ────────────────────────────────────────
TLP_ENABLE=1
TLP_AUTO_SWITCH=1
TLP_PROFILE_AC=performance
TLP_PROFILE_BAT=power-saver

# ── CPU (intel_cpufreq passive mode) ────────────────────────────
# AC: full speed, governor performance, turbo ON, all P-states available
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_MIN_PERF_ON_AC=100
CPU_MAX_PERF_ON_AC=100
CPU_BOOST_ON_AC=1
CPU_ENERGY_PERF_POLICY_ON_AC=performance

# Battery: throttle hard, governor powersave, turbo OFF, minimum P-states
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=20
CPU_BOOST_ON_BAT=0
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Power-saver profile (tlp power-saver): even more aggressive
CPU_SCALING_GOVERNOR_ON_SAV=powersave
CPU_MIN_PERF_ON_SAV=0
CPU_MAX_PERF_ON_SAV=15
CPU_BOOST_ON_SAV=0
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# ── Platform profile ────────────────────────────────────────────
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=low-power
PLATFORM_PROFILE_ON_SAV=low-power

# ── Suspend ─────────────────────────────────────────────────────
MEM_SLEEP_ON_AC=s2idle
MEM_SLEEP_ON_BAT=deep

# ── Disk I/O ────────────────────────────────────────────────────
DISK_IDLE_SECS_ON_AC=0
MAX_LOST_WORK_SECS_ON_AC=15
MAX_LOST_WORK_SECS_ON_BAT=60

# SATA link power
SATA_LINKPWR_ON_AC="max_performance"
SATA_LINKPWR_ON_BAT="min_power_with_dipm"
SATA_LINKPWR_DENYLIST=""

# Disk APM: max on AC (no spin-down), aggressive on battery
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="128 128"
DISK_SPINDOWN_TIMEOUT_ON_AC="0 0"
DISK_SPINDOWN_TIMEOUT_ON_BAT="12 12"

# AHCI runtime PM
AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=8

# ── PCIe ASPM ───────────────────────────────────────────────────
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
PCIE_ASPM_ON_SAV=powersupersave

# PCIe runtime PM
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# ── Wi-Fi ───────────────────────────────────────────────────────
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# ── USB ─────────────────────────────────────────────────────────
USB_AUTOSUSPEND=1
USB_EXCLUDE_AUDIO=1
USB_EXCLUDE_PRINTER=1

# ── Sound ───────────────────────────────────────────────────────
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=10
SOUND_POWER_SAVE_CONTROLLER=Y

# ── Misc ────────────────────────────────────────────────────────
NMI_WATCHDOG=0
WOL_DISABLE=Y
