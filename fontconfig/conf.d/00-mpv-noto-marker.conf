<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Mark explicit "Noto Sans" requests (e.g. mpv's osd-font) so the
       UI-font override in 99-ui-font.conf does not replace them with Inter. -->
  <match target="pattern">
    <test name="family" qual="first">
      <string>Noto Sans</string>
    </test>
    <edit name="mpv_explicit_noto" mode="assign" binding="strong">
      <bool>true</bool>
    </edit>
  </match>
</fontconfig>
