<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- UI font for GTK/Qt and apps that follow fontconfig generics.
       TO SWAP FONT: edit the three font names on lines 11, 22, 31. Prepend keeps CJK. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <!-- Electron/Chromium apps sometimes ask for system-ui (rewritten to
       "system" internally); Omarchy maps it to Liberation Sans otherwise. -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>system</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>
</fontconfig>
