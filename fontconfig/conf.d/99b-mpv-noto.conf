<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Restore Noto Sans as the first family for marked requests. -->
  <match target="pattern">
    <test name="mpv_explicit_noto" compare="eq">
      <bool>true</bool>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Sans</string>
    </edit>
  </match>
</fontconfig>
